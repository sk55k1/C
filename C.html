
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question For You ❤️</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: Arial, sans-serif;
        overflow: hidden;
        text-align: center;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 25px;
        box-shadow: 0 10px 40px #0003;
        width: 320px;
        z-index: 2;
    }

    h1 { color: #ff4d79; }

    p { color: #777; font-size: 18px; }

    button {
        background: #ff4d79;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 30px;
        font-size: 18px;
        cursor: pointer;
        margin: 8px;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
        background: #ff2459;
    }

    .heart {
        position: absolute;
        bottom: -30px;
        animation: float 6s linear infinite;
        font-size: 25px;
    }

    @keyframes float {
        to {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>

<div class="container" id="box">
    <h1>Hey Beautiful ❤️</h1>
    <p>I have a very important question...</p>
    <h2>Will you be my mommy? 🥺💕</h2>
    <button onclick="yes()">YES 💗</button>
</div>

<script>
function yes() {
    document.getElementById("box").innerHTML = `
        <h1>YAAAAAY!!! ❤️🥹</h1>
        <h2>You just made me the happiest person alive!</h2>
        <p>I love you already! 💕</p>
        <h1>💍❤️🌹</h1>
        <p>Forever starts now...</p>
    `;
}

function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
